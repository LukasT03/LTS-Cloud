# One-time setup on the VPS:
#   cp nginx.conf /etc/nginx/sites-available/lts-cloud
#   ln -s ../sites-available/lts-cloud /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d cloud.lts-design.com --redirect
# certbot then adds a port 80 block for the redirect. Add "access_log off;" there too.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cloud.lts-design.com;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The server pings every 30 s, so connections are never idle this long.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
